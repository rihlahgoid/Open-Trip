<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>RihlahGo Open Trip</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RihlahGo Trip">
<meta name="theme-color" content="#124830">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f3f1e8;--card:#fffdf8;--tx:#1b2a23;--mut:#66756d;--br:#e0dccb;--pri:#124830;--on:#fff;--soft:#e1efe7;--gold:#e8b114;--gold2:#fbf0cc;--red:#a8372c;--ok:#1f8a5f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1814;--card:#16231e;--tx:#e9efe9;--mut:#9baba3;--br:#2b3b34;--pri:#47b88b;--on:#08170f;--soft:#1a3329;--gold2:#34290d;--red:#f4877d}}
:root[data-theme="dark"]{--bg:#0e1814;--card:#16231e;--tx:#e9efe9;--mut:#9baba3;--br:#2b3b34;--pri:#47b88b;--on:#08170f;--soft:#1a3329;--gold2:#34290d;--red:#f4877d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:760px;margin:0 auto;padding:12px 14px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.brand{background:#fff;border-radius:10px;padding:4px 10px;user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:default}.brand img{height:30px;width:auto;display:block}
.hero{position:relative;overflow:hidden;color:#fff;border-radius:16px;padding:16px 16px 100px;margin-bottom:12px}
.hero .hz{position:relative;z-index:1}.hero svg{position:absolute;left:0;bottom:0;width:100%;height:100px}
.hero h1{font:700 26px/1.15 Georgia,serif;margin:6px 0 4px}.hero p{margin:4px 0 0;opacity:.92;font-size:14px}
.hb{font-size:12.5px;font-weight:700;background:rgba(255,255,255,.2);display:inline-block;padding:2px 10px;border-radius:99px;margin-bottom:6px}
.th-timnas{border-bottom:7px solid #fff}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.meta span,.cr span{background:rgba(255,255,255,.2);border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600}
.bar50{height:7px;border-radius:5px;background:rgba(255,255,255,.28);margin-top:10px;overflow:hidden}.bar50 i{display:block;height:100%;background:var(--gold);border-radius:5px}.bar50.dk{background:var(--br)}.sm{font-size:12.5px;margin-top:4px}
.hl{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}.hl span{background:var(--soft);color:var(--pri);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:600}
.card{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12.5px;color:var(--mut);margin:10px 0 3px;font-weight:600}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:inherit;background:var(--bg);border:1px solid var(--br);border-radius:9px;padding:9px 10px}
input[type=checkbox],input[type=radio]{width:auto}input[type=color]{padding:2px;height:40px}
textarea{min-height:64px}
.btn{background:var(--pri);color:var(--on);border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--br)}.btn.a{background:var(--gold);color:#2b2100}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.s{padding:6px 10px;font-size:13px}.btn.d{color:var(--red)}
.nav{display:flex;gap:8px;margin-top:14px}.nav .btn{flex:1}
.nav.sticky{position:sticky;bottom:8px;background:var(--card);border:1px solid var(--br);border-radius:14px;padding:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);align-items:center;z-index:3}.tt{display:flex;flex-direction:column;padding:0 8px;line-height:1.2;min-width:96px}.tt b{font-size:16px;color:var(--pri)}.nav.sticky .btn{padding:12px 14px}
.steps{display:flex;gap:4px;margin-bottom:12px}.steps i{flex:1;height:5px;border-radius:3px;background:var(--br)}.steps i.on{background:var(--pri)}
.stl{font-size:12.5px;color:var(--mut);margin-bottom:6px}
.err{color:var(--red);font-size:13.5px;margin-top:10px;font-weight:600}.ok{color:var(--ok)}.mut{color:var(--mut);font-size:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mem{border:1px dashed var(--br);border-radius:10px;padding:8px;margin-top:8px}
.stp{display:flex;align-items:center;gap:12px}.stp b{font-size:20px;min-width:28px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--br);background:var(--card);border-radius:99px;padding:5px 11px;font-size:13px;color:var(--tx)}.chip.on{background:var(--pri);color:var(--on);border-color:var(--pri)}.chip.done{border-color:var(--ok)}
.bus{max-width:340px;margin:0 auto;background:var(--card);border:2px solid var(--br);border-radius:28px 28px 14px 14px;padding:12px}
.front{text-align:center;font-size:12px;color:var(--mut);border-bottom:2px dashed var(--br);padding-bottom:8px;margin-bottom:8px}
.sr{display:grid;grid-template-columns:1fr 1fr 20px 1fr 1fr;gap:6px;margin-bottom:6px}.sr.back{grid-template-columns:repeat(6,1fr)}
.s{aspect-ratio:1;border-radius:8px 8px 4px 4px;border:1px solid var(--br);background:var(--soft);font:700 14px system-ui;color:var(--pri);cursor:pointer;padding:0}
.s.t{background:#cfcfc6;color:#6b6b63;cursor:not-allowed}.s.h{background:var(--gold2);color:#8a5a00;border-color:var(--gold);cursor:not-allowed}.s.m{background:var(--pri);color:var(--on)}.s.b{background:repeating-linear-gradient(45deg,#d9d9d0,#d9d9d0 4px,#c4c4ba 4px,#c4c4ba 8px);color:#777}.s.a{outline:3px solid var(--gold)}
.leg{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;font-size:12px;color:var(--mut);margin-top:10px}.leg span:before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--c);border:1px solid var(--br)}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--br);border-radius:12px;padding:10px;margin-top:8px;cursor:pointer}.opt.on{border-color:var(--pri);background:var(--soft)}
.tot{background:var(--gold2);border-radius:12px;padding:10px 12px;margin-top:12px}.tot b{font-size:19px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--br);text-align:left;vertical-align:top}th{color:var(--mut);font-weight:600;width:38%}
.ck{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:14px}.ck input{margin-top:4px;width:20px;height:20px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}.tabs button{white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.stats div{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:8px}.stats b{display:block;color:var(--pri);font-size:17px}.stats span{font-size:11.5px;color:var(--mut)}
@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}.row2{grid-template-columns:1fr}.hero h1{font-size:22px}}
.badge{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--gold2);color:#8a5a00}.badge.l{background:var(--soft);color:var(--ok)}.badge.x{background:#f6dedb;color:var(--red)}
.wa{background:#dcf8c6;color:#111;border-radius:10px;padding:8px 10px;margin-top:6px;white-space:pre-wrap;font-size:13.5px}
.rbox{background:var(--bg);border:1px dashed var(--br);border-radius:12px;padding:10px;margin-top:10px;font-size:13.5px}
.tc2{border-radius:18px;overflow:hidden;border:1px solid var(--br);background:var(--card);margin-bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,.08)}.tcb2{position:relative;min-height:150px;color:#fff;padding:14px}.tcb2 svg{position:absolute;left:0;bottom:0;width:100%;height:72px}.tcb2 h2{position:relative;margin:6px 0 0;font:700 22px Georgia,serif}.tcb2 .hb{position:relative}
.tcc{padding:12px 14px 14px}.pr{font:700 20px Georgia,serif;color:var(--pri)}.pr small{font:12px system-ui;color:var(--mut);margin-left:3px}.sm2{font-size:12.5px;color:var(--mut);margin:4px 0 10px}.cr{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:no-preference){.hb{animation:fl 3.2s ease-in-out infinite}}
</style>
<script>
window.addEventListener("error",function(e){window.__err=(e.message||"")+(e.filename?" @"+e.filename.split("/").pop():"")});
setTimeout(function(){if(!window.__boot){var a=document.getElementById("app");if(a)a.innerHTML='<div style="padding:24px;font-family:system-ui">Halaman gagal dimuat ('+(window.__err||"tanpa detail")+'). Muat ulang halaman. Jika tetap gagal, hubungi admin RihlahGo.</div>'}},7000);
</script>
</head>

const parseCfg=t=>{t=String(t);const i=t.indexOf("apiKey");if(i<0)throw Error("apiKey tidak ditemukan");const a=t.lastIndexOf("{",i),b=t.indexOf("}",i);if(a<0||b<0)throw Error("format tidak dikenali");const c=new Function("return ("+t.slice(a,b+1)+")")();if(!c.apiKey||!c.projectId)throw Error("apiKey/projectId kosong");return c};
async function getCfg(){try{const c=parseCfg(await(await fetch("config.js?v="+Date.now(),{cache:"no-store"})).text());if(!/ISI_/.test(c.apiKey+c.projectId))return c}catch(e){}try{const t=localStorage.getItem("rg_cfg");if(t)return JSON.parse(t)}catch(e){}return null}
const sub=(r,cb)=>unsubs.push(FB.onSnapshot(r,cb,e=>{if(e.code!=="permission-denied")console.warn(e)}));
function startPublic(){
 sub(dref("ot_site","main"),s=>{const d=s.exists()?s.data():{};S.site={...CL(DEFSITE),...d,pinfo:{...DEFSITE.pinfo,...(d.pinfo||{})},tx:d.tx||{}};ready.site=1;applyBrand();render(true)});
 sub(cref("ot_trips"),s=>{S.trips=s.docs.map(d=>({...TPL({}),...d.data(),id:d.id})).sort((a,b)=>(a.ts||0)-(b.ts||0));ready.trips=1;render(true)});
 sub(cref("ot_seats"),s=>{S.seats={};s.docs.forEach(d=>{const x=d.data();S.seats[x.tid+":"+x.n]=x});ready.seats=1;render(true)})}
function startAdmin(){if(admSubs.length)return;
 const sb2=(r,cb)=>admSubs.push(FB.onSnapshot(r,cb,e=>{if(e.code==="permission-denied"){loginMsg="Akun ini tidak diizinkan sebagai admin.";FB.signOut(FB.auth)}}));
 sb2(cref("ot_bookings"),s=>{S.bookings=s.docs.map(d=>({...d.data(),id:d.id}));render(true)});}
function stopAdmin(){admSubs.forEach(f=>f());admSubs=[];S.bookings=[];S.verifs=[]}
async function ensureBg(){if(S.bgTried)return;S.bgTried=true;try{const d=await FB.getDoc(dref("ot_assets","invbg"));if(d.exists())S.invbg=d.data().data}catch(e){}}
async function boot(){
 try{last=JSON.parse(localStorage.getItem("rg_last")||"null")}catch(e){}
 const cfg=await getCfg();
 if(!cfg){fatal=route==="admin"?"":"Situs belum dikonfigurasi. Hubungi admin RihlahGo.";if(route==="admin"){$("#app").innerHTML='<div class="card"><b>Konfigurasi Firebase belum diisi</b><label>Tempel isi firebaseConfig</label><textarea id="cfgTxt"></textarea><button class="btn a s" id="cfgSave" style="margin-top:8px">Simpan</button></div>';$("#cfgSave").onclick=()=>{try{localStorage.setItem("rg_cfg",JSON.stringify(parseCfg($("#cfgTxt").value)));location.reload()}catch(e){alert("Tidak valid: "+e.message)}}}else render();return}
 try{const B="https://www.gstatic.com/firebasejs/10.14.1/",[A,Au,F]=await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-auth.js"),import(B+"firebase-firestore.js")]);
  const app=A.initializeApp(cfg);FB={...Au,...F,auth:Au.getAuth(app),db:F.getFirestore(app)};
 }catch(e){fatal="Gagal memuat Firebase: "+e.message;render();return}
 FB.onAuthStateChanged(FB.auth,async u=>{
  if(!u){AUTHU=null;UID=null;stopAdmin();try{await FB.signInAnonymously(FB.auth)}catch(e){fatal="Login anonim belum diaktifkan di Firebase (Authentication → Sign-in method → Anonymous). Kode: "+(e.code||e.message);render()}return}
  AUTHU=u;UID=u.uid;if(!started){started=true;startPublic()}
  if(!u.isAnonymous){startAdmin();ensureBg()}else stopAdmin();
  render()})}
boot();render();
</script>
</body>
</html>
